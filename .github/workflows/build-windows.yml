name: Build DOTA AI Windows installer (Inno Setup)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check project structure
        run: npm run check

      - name: Build unpacked Electron application
        run: npm run dist:win:dir

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "installer\DOTA-AI.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "release\DOTA-AI-Setup-0.2.0.exe")) { throw "Installer EXE was not produced." }

      - name: Upload Inno Setup installer
        uses: actions/upload-artifact@v4
        with:
          name: DOTA-AI-Inno-Setup
          path: release/DOTA-AI-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
