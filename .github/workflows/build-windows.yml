name: Build DOTA AI Windows installer (Inno Setup)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Create Dota 2 application icon from Steam artwork
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $source = Join-Path $env:TEMP "dota2-icon-source.jpg"
          $iconUrl = "https://cdn.cloudflare.steamstatic.com/steamcommunity/public/images/apps/570/48eb825bb93787945065b460bdc109ebf.jpg"
          try {
            Invoke-WebRequest -Uri $iconUrl -OutFile $source
          } catch {
            Invoke-WebRequest -Uri "https://cdn.akamai.steamstatic.com/steam/apps/570/header.jpg" -OutFile $source
          }
          Add-Type -AssemblyName System.Drawing
          $image = [System.Drawing.Image]::FromFile($source)
          $side = [Math]::Min($image.Width, $image.Height)
          $left = [int](($image.Width - $side) / 2)
          $top = [int](($image.Height - $side) / 2)
          $bitmap = New-Object System.Drawing.Bitmap 256, 256
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
          $graphics.DrawImage($image, (New-Object System.Drawing.Rectangle 0, 0, 256, 256), (New-Object System.Drawing.Rectangle $left, $top, $side, $side), [System.Drawing.GraphicsUnit]::Pixel)
          $handle = $bitmap.GetHicon()
          $icon = [System.Drawing.Icon]::FromHandle($handle)
          $stream = [System.IO.File]::Create("build/dota2.ico")
          $icon.Save($stream)
          $stream.Close()
          $icon.Dispose()
          $graphics.Dispose()
          $bitmap.Dispose()
          $image.Dispose()

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check project structure
        run: npm run check

      - name: Build unpacked Electron application
        run: npm run dist:win:dir

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "installer\DOTA-AI.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "release\DOTA-AI-Setup-0.2.0.exe")) { throw "Installer EXE was not produced." }

      - name: Upload Inno Setup installer
        uses: actions/upload-artifact@v4
        with:
          name: DOTA-AI-Inno-Setup
          path: release/DOTA-AI-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
